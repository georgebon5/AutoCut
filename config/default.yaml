ingest:
  target_fps: 30
  audio_sample_rate: 16000

vad:
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 100

silence:
  min_silence: 0.5       # gaps longer than this (seconds) are cut
  padding: 0.1           # seconds of speech kept on each side of a cut

render:
  audio_crossfade_ms: 10
  crf: 18
  preset: fast

transcribe:
  model_size: medium
  language: el
  compute_type: int8
  beam_size: 5

fillers:
  min_isolation_ms: 200
  padding_ms: 50
  words:
    - εε
    - εεε
    - εμ
    - εμμ
    - αα
    - ααα
    - μμ
    - μμμ
    - λοιπόν
    - δηλαδή

takes:
  similarity_threshold: 0.85
  min_gap_s: 0.5
  min_words: 3

captions:
  formats: [srt, ass]
  max_words: 5
  max_duration_s: 3.0
  min_gap_s: 0.4
  style: tiktok

keywords:
  exclamations:
    - θεέ μου
    - θεε μου
    - δεν το πιστεύω
    - δεν το πιστευω
    - ωραία
    - ωραια
    - τέλεια
    - τελεια
    - απίστευτο
    - απιστευτο
    - ωπα
    - ώπα
    - ουάου
    - ουαου
    - wow
    - αμάν
    - αμαν
    - χαχα
    - χαχαχα
  price_pattern: '\d+(?:[.,]\d+)?\s*(?:€|ευρώ|ευρω|euro)'
  enable_proper_names: true
  exclamation_weight: 1.0
  price_weight: 1.0
  proper_name_weight: 0.5

scoring:
  weights:
    rms_energy: 0.22
    pitch_std: 0.18
    voiced_fraction: 0.13
    speaking_rate: 0.17
    motion_mean: 0.15
    keyword_hits: 0.15
  feature_max:
    rms_energy: 0.15
    pitch_std: 50.0
    voiced_fraction: 1.0
    speaking_rate: 6.0
    motion_mean: 0.20
    keyword_hits: 3.0

presets:
  targets:
    tight: 45.0       # seconds — fast TikTok hook cut
    medium: 90.0      # seconds — standard "day with me" length
    loose: 180.0      # seconds — long-form vlog
  tolerance: 0.10     # allow up to +10% over target to avoid dropping edge segments
