[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocut"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "librosa>=0.10",
    "praat-parselmouth>=0.4",
    "opencv-python-headless>=4.8",
    "scenedetect[opencv]>=0.6",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.scripts]
autocut = "autocut.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["autocut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
